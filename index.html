<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>우리 반 책방</title>
    <style>
      :root {
        --bg: #f6f4ef;
        --card: #fff;
        --cover: #e5eee7;
        --green: #3d6b4f;
        --green-d: #2f5640;
        --text: #222;
        --sub: #666;
        --line: #e6e2d9;
        --focus: #2f5fd0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui,
          sans-serif;
      }
      .wrap {
        max-width: 1000px;
        margin: 0 auto;
        padding: 28px 20px 60px;
      }
      h1 {
        font-size: 2rem;
        margin: 0 0 8px;
      }
      .lead {
        color: var(--sub);
        margin: 0 0 36px;
      }
      h2 {
        font-size: 1.25rem;
        margin: 0 0 16px;
      }
      form {
        display: flex;
        gap: 8px;
        align-items: stretch;
      }
      select,
      .box input,
      button {
        font: inherit;
      }
      select {
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        min-width: 96px;
      }
      .box {
        position: relative;
        flex: 1;
      }
      .box input {
        width: 100%;
        height: 46px;
        padding: 0 44px 0 14px;
        border: 2px solid var(--line);
        border-radius: 10px;
        background: #fff;
      }
      .box input:focus {
        outline: none;
        border-color: var(--focus);
      }
      .clear {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        border: 0;
        background: none;
        font-size: 1.1rem;
        color: #456;
        cursor: pointer;
        padding: 6px;
        display: none;
      }
      .submit {
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        background: var(--green);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      .submit:hover {
        background: var(--green-d);
      }
      .status {
        color: var(--sub);
        font-size: 0.9rem;
        margin: 12px 0 16px;
        min-height: 1.2em;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }
      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
      }
      .cover {
        aspect-ratio: 3/4;
        background: var(--cover);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        text-align: center;
        color: var(--green);
        font-weight: 600;
        font-size: 0.9rem;
        overflow: hidden;
      }
      .cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .cover.has-img {
        padding: 0;
        background: #f1f1f1;
      }
      .info {
        padding: 12px 14px 14px;
      }
      .title {
        font-weight: 700;
        font-size: 1rem;
        margin: 0 0 6px;
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .meta {
        color: var(--sub);
        font-size: 0.82rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .more {
        display: block;
        margin: 24px auto 0;
        padding: 10px 24px;
        border: 1px solid var(--green);
        border-radius: 10px;
        background: #fff;
        color: var(--green);
        font-weight: 700;
        cursor: pointer;
      }
      .more[hidden] {
        display: none;
      }
      .credit {
        margin-top: 40px;
        color: #999;
        font-size: 0.75rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>📚 우리 반 책방</h1>
      <p class="lead">
        읽고 싶은 책을 제목, 저자, 출판사, ISBN으로 찾아보세요.
      </p>

      <h2>🔍 책 검색</h2>
      <form id="f">
        <select id="target" aria-label="검색 기준">
          <option value="title">제목</option>
          <option value="person">저자</option>
          <option value="publisher">출판사</option>
          <option value="isbn">ISBN</option>
        </select>
        <div class="box">
          <input
            id="q"
            type="search"
            placeholder="검색어를 입력하세요"
            autocomplete="off"
            aria-label="검색어"
          />
          <button type="button" class="clear" id="clear" aria-label="지우기">
            ✕
          </button>
        </div>
        <button class="submit" type="submit">검색</button>
      </form>

      <p class="status" id="status" aria-live="polite"></p>
      <div class="grid" id="grid"></div>
      <button class="more" id="more" hidden>더 보기</button>

      <p class="credit">도서 정보·표지: 카카오 책 검색</p>
    </div>

    <script>
      /* ===== 설정 =====
       * PROXY_URL : Code.gs(Apps Script)를 웹 앱으로 배포한 주소(/exec). 키가 밖으로 드러나지 않아요. ← 권장
       * KAKAO_KEY : PROXY_URL이 비어 있을 때만 사용. 내 컴퓨터에서 잠깐 시험할 때만 넣고, 깃허브에 올리기 전엔 지우세요.
       */
      const PROXY_URL = "https://script.google.com/macros/s/.../exec"; // 그대로 두기
      const KAKAO_KEY = "";
      const PAGE_SIZE = 20;

      const $ = (id) => document.getElementById(id);
      const grid = $("grid"),
        status = $("status"),
        moreBtn = $("more"),
        qInput = $("q"),
        clearBtn = $("clear");
      let state = {
        query: "",
        target: "title",
        page: 1,
        total: 0,
        loading: false,
      };

      async function searchBooks(query, target, page) {
        const params = new URLSearchParams({
          query,
          target,
          page,
          size: PAGE_SIZE,
        });
        let res;
        if (PROXY_URL) {
          res = await fetch(`${PROXY_URL}?${params}`);
        } else if (KAKAO_KEY) {
          res = await fetch(`https://dapi.kakao.com/v3/search/book?${params}`, {
            headers: { Authorization: `KakaoAK ${KAKAO_KEY}` },
          });
        } else {
          throw new Error("PROXY_URL 또는 KAKAO_KEY를 설정해 주세요.");
        }
        const data = await res.json();
        if (!res.ok || data.error || data.errorType)
          throw new Error(data.message || data.error || "검색 실패");
        return data;
      }

      function esc(s) {
        return String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      function authorLine(b) {
        const a = (b.authors || []).join(", ");
        const t = (b.translators || []).length
          ? ` · 역: ${b.translators.join(", ")}`
          : "";
        return a ? `저자 : ${a}${t}` : b.publisher || "";
      }

      function makeCard(b) {
        const card = document.createElement("a");
        card.className = "card";
        card.href = b.url || "#";
        card.target = "_blank";
        card.rel = "noopener";
        card.innerHTML = `
    <div class="cover">${esc(b.title)}</div>
    <div class="info">
      <p class="title">${esc(b.title)}</p>
      <p class="meta" title="${esc(authorLine(b))}">${esc(authorLine(b))}</p>
      <p class="meta">${esc(b.publisher)}</p>
    </div>`;
        if (b.thumbnail)
          setCover(card.querySelector(".cover"), b.thumbnail, b.title);
        return card;
      }

      /* 표지: 카카오 썸네일을 불러오고, 실패하면 제목 칸 유지 */
      function setCover(el, thumb, title) {
        const img = document.createElement("img");
        img.alt = `${title} 표지`;
        img.referrerPolicy = "no-referrer";
        img.style.display = "none"; // 불러오기 전에는 숨기고 제목 칸을 보여 줌
        img.onload = () => {
          el.classList.add("has-img");
          el.replaceChildren(img);
          img.style.display = "block";
        };
        el.appendChild(img); // 화면에 붙인 상태에서 불러와야 브라우저가 실제로 내려받음
        img.src = thumb.replace(/^http:\/\//, "https://");
      }

      async function run(reset) {
        if (state.loading) return;
        state.loading = true;
        moreBtn.disabled = true;
        if (reset) {
          grid.replaceChildren();
          status.textContent = "찾는 중…";
        }
        try {
          const data = await searchBooks(state.query, state.target, state.page);
          state.total = data.meta.total_count;
          const frag = document.createDocumentFragment();
          data.documents.forEach((b) => frag.appendChild(makeCard(b)));
          grid.appendChild(frag);
          status.textContent = state.total
            ? `“${state.query}” 검색 결과 ${state.total.toLocaleString()}건`
            : `“${state.query}”에 맞는 책이 없어요.`;
          moreBtn.hidden = data.meta.is_end || state.page >= 50;
        } catch (e) {
          status.textContent = `검색 중 문제가 생겼어요: ${e.message}`;
          moreBtn.hidden = true;
        } finally {
          state.loading = false;
          moreBtn.disabled = false;
        }
      }

      $("f").addEventListener("submit", (e) => {
        e.preventDefault();
        const q = qInput.value.trim();
        if (!q) {
          qInput.focus();
          return;
        }
        state = { ...state, query: q, target: $("target").value, page: 1 };
        run(true);
      });
      moreBtn.addEventListener("click", () => {
        state.page++;
        run(false);
      });
      qInput.addEventListener("input", () => {
        clearBtn.style.display = qInput.value ? "block" : "none";
      });
      clearBtn.addEventListener("click", () => {
        qInput.value = "";
        clearBtn.style.display = "none";
        qInput.focus();
      });
    </script>
  </body>
</html>
